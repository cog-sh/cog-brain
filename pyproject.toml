[project]
name = "second-brain"
version = "0.1.0"
description = "MCP server + incremental indexer for the SECOND_BRAIN Obsidian vault (hybrid search over Qdrant)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.16",
    "requests>=2.31",
    "fastembed>=0.7",
    "mcp>=1,<2",
]

[project.scripts]
second-brain = "second_brain.server:main"
second-brain-index = "second_brain.indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]
