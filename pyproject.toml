[project]
name = "cog-brain"
version = "0.2.0"
description = "cog-brain: shared Markdown memory for people and coding agents, with local code execution, lifecycle recall and optional MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.16",
    "requests>=2.31",
    "fastembed>=0.7",
    "mcp>=1,<2",
    "ruamel-yaml>=0.18,<0.20",
    "tomlkit>=0.13,<1",
]

[project.scripts]
cog-brain = "cog_brain.__main__:main"
cog-brain-index = "cog_brain.indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cog_brain"]
